name: Provenance card checks

on:
  pull_request:
    paths:
      - .github/workflows/provenance-card.yml
      - skills/provenance-card/**
      - skills/release-evidence/scripts/verify_public_main.py
      - tests/test_provenance_card.py
      - tests/test_trace_build.py
      - tests/test_verify_trace_receipts.py
      - tests/test_verify_public_main.py
      - tests/fixtures/provenance-card/**

permissions:
  contents: read

jobs:
  provenance-card:
    runs-on: ubuntu-latest
    steps:
      - name: Check out proposed source
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.12"
      - name: Run repository tests
        run: python3 -m unittest discover -s tests -v
      - name: Build and verify the public-safe fixture
        run: |
          python3 skills/provenance-card/scripts/provenance_card.py build \
            tests/fixtures/provenance-card/manifest.json \
            --out "$RUNNER_TEMP/provenance-card-fixture" \
            --input I1=tests/fixtures/provenance-card/base-readme.md \
            --input I2=tests/fixtures/provenance-card/branch-readme.md
          python3 skills/provenance-card/scripts/provenance_card.py verify \
            "$RUNNER_TEMP/provenance-card-fixture" \
            --input I1=tests/fixtures/provenance-card/base-readme.md \
            --input I2=tests/fixtures/provenance-card/branch-readme.md
      - name: Check saved trace receipts against fresh fixture bytes
        run: |
          python3 skills/provenance-card/scripts/verify_trace_receipts.py \
            --root . \
            --generated-dir "$RUNNER_TEMP/provenance-card-fixture"
